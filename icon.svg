<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Degradê de fundo (Slate-900 para Slate-800) -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Degradê do Anel do Timer (Tema Emerald) -->
    <linearGradient id="ring-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Brilho Neon para o Anel -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sombra projetada para o Raio -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo do Ícone (App Icon Base) -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />

  <!-- Botão superior do Cronômetro -->
  <rect x="236" y="30" width="40" height="35" rx="10" fill="#10b981" />
  <rect x="216" y="65" width="80" height="20" rx="6" fill="#34d399" />

  <!-- Trilho de fundo do anel -->
  <circle cx="256" cy="265" r="160" fill="none" stroke="#334155" stroke-width="28" />

  <!-- Anel de progresso (Cronômetro rolando) com Brilho Neon -->
  <circle cx="256" cy="265" r="160" fill="none" stroke="url(#ring-grad)" stroke-width="28" stroke-linecap="round" stroke-dasharray="1005" stroke-dashoffset="300" filter="url(#neon-glow)" transform="rotate(-90 256 265)" />

  <!-- Marcadores de tempo (Estética de relógio) -->
  <line x1="256" y1="75" x2="256" y2="95" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="446" y1="265" x2="426" y2="265" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="455" x2="256" y2="435" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="66" y1="265" x2="86" y2="265" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Ícone de Raio Central (Foco/Ação) -->
  <polygon points="290,145 170,295 245,295 210,405 345,240 270,240" fill="#ffffff" filter="url(#drop-shadow)" />
</svg>
